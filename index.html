<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consulta Crédito Material</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --band:#14233d; --band-fg:#eef2f8; --band-muted:#9fb0c9; --band-field:#ffffff; --band-field-fg:#14233d;
  --bg:#eef0f3; --surface:#ffffff; --sunk:#f3f5f8; --fg:#18202c; --muted:#5d6878; --line:#d9dee6;
  --accent:#2f5bd3; --accent-fg:#ffffff;
  --ok:#14804a; --ok-strong:#14804a; --ok-bg:#e4f4ea; --no:#c0352b; --no-strong:#c0352b; --no-bg:#fbe8e6; --warn:#8a5a00; --warn-bg:#fdf1d8;
  --on-strong:#ffffff;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Archivo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --band:#0b1322; --band-fg:#e6ecf5; --band-muted:#8496b2; --band-field:#18233a; --band-field-fg:#e6ecf5;
  --bg:#0e131b; --surface:#161d28; --sunk:#1c2532; --fg:#e4e9f0; --muted:#97a3b5; --line:#2a3443;
  --accent:#86a8ff; --accent-fg:#0b1322;
  --ok:#62d394; --ok-strong:#1f8f55; --ok-bg:#123022; --no:#ff8d82; --no-strong:#c2412f; --no-bg:#3a1915; --warn:#f2c260; --warn-bg:#33270c;
  --on-strong:#ffffff; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.inner{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.band{background:var(--band);color:var(--band-fg);padding-top:env(safe-area-inset-top,0px)}
.band .inner{padding-block:22px 26px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--band-muted);font-weight:500;margin-left:8px;font-size:.9rem}
.bandbtn{font:inherit;font-size:.84rem;font-weight:600;color:var(--band-fg);border:1px solid color-mix(in srgb,var(--band-fg) 30%,transparent);padding:7px 12px;border-radius:6px;cursor:pointer;background:transparent}
.bandbtn:hover{background:color-mix(in srgb,var(--band-fg) 10%,transparent)}
.search{display:flex;align-items:stretch;background:var(--band-field);border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.search label{display:flex;align-items:center;padding:0 14px;font-family:var(--f-mono);font-size:.75rem;font-weight:600;letter-spacing:.08em;color:var(--band-field-fg);opacity:.6;border-right:1px solid var(--line);white-space:nowrap}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--band-field-fg);font-family:var(--f-mono);font-size:1.5rem;font-weight:500;padding:16px 16px}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 60%,transparent),0 6px 24px rgba(0,0,0,.18)}
.bandfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--band-muted)}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stats b{color:var(--band-fg)}
.stats a{color:var(--band-fg)}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;padding-block:22px 60px}
@media (max-width:860px){.desk{grid-template-columns:1fr}}
.main,.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:.88rem;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.hint{color:var(--muted);font-size:.82rem}
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vtop{display:flex;align-items:center;gap:14px;padding:18px 22px;background:var(--sunk);color:var(--fg)}
.verdict.ok .vtop{background:var(--ok-strong);color:var(--on-strong)}
.verdict.no .vtop{background:var(--no-strong);color:var(--on-strong)}
.vicon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,currentColor 18%,transparent)}
.vbadge{font-family:var(--f-display);font-weight:800;font-size:2.1rem;letter-spacing:.02em;line-height:1}
.vdesc{padding:18px 22px 4px;font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.verdict .kv{padding:10px 22px 20px;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 20px}
.verdict .kv div{min-width:0}
.kv dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.kv dd{margin:3px 0 0;font-weight:600;overflow-wrap:anywhere}
.verdict .dup{margin:0 22px 20px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:.82rem;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--sunk);border:1px solid var(--line)}
.verdict.ok .chip{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.verdict.no .chip{color:var(--no);background:var(--no-bg);border-color:transparent}
.dup{font-size:.82rem;color:var(--warn);background:var(--warn-bg);padding:7px 10px;border-radius:8px}
.empty{color:var(--muted);text-align:center;padding:36px 16px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.empty a{color:var(--accent)}
.list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.list button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.list button:first-child{border-top:0}
.list button:hover,.list button:focus-visible{background:var(--sunk)}
.list .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.no{color:var(--no);background:var(--no-bg)} .pill.na{color:var(--muted);background:var(--sunk)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h2{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;font-weight:700}
.btn{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.toast{color:var(--muted);font-size:.82rem}
textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:.9rem;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);resize:vertical}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr.ok td{background:var(--ok-bg)} tr.no td{background:var(--no-bg)}
.legal p{margin:8px 0;font-size:.88rem;max-width:75ch}
.recent{display:flex;flex-direction:column}
.recent button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer}
.recent button:first-child{border-top:0}
.recent button:hover .c,.recent button:focus-visible .c{color:var(--accent)}
.recent .c{font-family:var(--f-mono);font-size:.85rem;font-weight:600}
.recent .d{grid-column:1/-1;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail #exc table{font-size:.8rem}
@media (max-width:520px){.vbadge{font-size:1.6rem}.search input{font-size:1.15rem}.search label{display:none}}
@media (prefers-reduced-motion:no-preference){.verdict{animation:in .2s ease-out}@keyframes in{from{transform:translateY(5px)}to{transform:none}}}
</style>
</head>
<body>
<div class="band">
  <div class="inner">
    <div class="brand">
      <h1>Crédito Material<span>PIS/COFINS · Lei 10.833/2003</span></h1>
      <label class="bandbtn" for="file">Atualizar base (.xlsx)</label>
      <input type="file" id="file" accept=".xlsx,.xls,.xlsm" hidden>
    </div>
    <div class="search">
      <label for="q">CÓDIGO</label>
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Código ou descrição do material" autofocus>
    </div>
    <div class="bandfoot">
      <div class="stats" id="stats"></div>
      <span>Com ou sem zeros à esquerda · Enter abre o primeiro resultado</span>
    </div>
  </div>
</div>

<div class="inner">
  <div class="desk">
    <div class="main">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="consulta" aria-selected="true">Consulta</button>
        <button role="tab" data-tab="lote" aria-selected="false">Em lote</button>
        <button role="tab" data-tab="legal" aria-selected="false">Base legal</button>
      </div>
      <div data-panel="consulta"><div id="out"></div></div>
      <div data-panel="lote" hidden>
        <div class="card">
          <h2>Vários códigos de uma vez</h2>
          <textarea id="batch" placeholder="Cole os códigos, um por linha (pode colar direto do Excel)"></textarea>
          <div class="row"><button class="btn primary" id="runBatch">Consultar lista</button><button class="btn" id="copyBatch" hidden>Copiar resultado</button><span class="toast" id="batchMsg"></span></div>
          <div class="tbl" id="batchOut" style="margin-top:10px"></div>
        </div>
      </div>
      <div data-panel="legal" hidden>
        <div class="card legal"><h2>Art. 3º — créditos permitidos e vedações</h2><div id="legal"></div></div>
      </div>
    </div>
    <aside class="rail">
      <div class="card">
        <h2>Consultados agora</h2>
        <div class="recent" id="recent"><p class="hint" style="margin:0">Os últimos códigos consultados aparecem aqui.</p></div>
      </div>
      <div class="card">
        <h2>Exceções</h2>
        <div class="tbl" id="exc"></div>
      </div>
    </aside>
  </div>
</div>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="app.js"></script>
</body>
</html>
